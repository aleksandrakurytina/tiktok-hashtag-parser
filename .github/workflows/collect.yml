name: Сбор данных для Pages

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Хештеги через запятую"
        required: false
        default: "работа,заработок,удаленка"
      limit:
        description: "Видео на тег"
        required: false
        default: "30"
      mode:
        description: "Режим"
        required: true
        default: "demo"
        type: choice
        options: [demo, live]
      no_details:
        description: "Не заходить на страницы видео (быстрее, полей меньше)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 6 * * *"   # каждый день в 06:00 UTC

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # для schedule inputs пустые — берём значения по умолчанию
      TAGS: ${{ inputs.tags || 'работа,заработок,удаленка' }}
      LIMIT: ${{ inputs.limit || '30' }}
      MODE: ${{ inputs.mode || (secrets.TIKTOK_SESSION != '' && 'live' || 'demo') }}
      HAS_SESSION: ${{ secrets.TIKTOK_SESSION }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Браузер для Playwright
        if: env.MODE != 'demo'
        run: python -m playwright install --with-deps chromium

      - name: Достаём сессию (если задан секрет TIKTOK_SESSION)
        if: env.HAS_SESSION != ''
        env:
          TIKTOK_SESSION: ${{ secrets.TIKTOK_SESSION }}
        run: |
          mkdir -p sessions
          echo "$TIKTOK_SESSION" | base64 -d > sessions/session.json
          echo "сессия восстановлена"

      - name: Сбор данных
        run: |
          args="--tags $TAGS --limit $LIMIT --mode $MODE"
          if [ "${{ github.event.inputs.no_details }}" = "true" ]; then
            args="$args --no-details"
          fi
          if [ -f sessions/session.json ]; then
            args="$args --session sessions/session.json"
          fi
          echo "запуск: python pages_export.py $args"
          python pages_export.py $args

      - name: Коммитим свежие данные
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "данные не изменились — коммитить нечего"
          else
            git commit -m "данные: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
